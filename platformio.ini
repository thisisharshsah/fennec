; Fennec firmware for the ST B-L475E-IOT01A (STM32L475VG: 1 MB flash, 128 KB RAM).
; The ST-LINK on this unit mounts as DIS_L4S5VI, but the MCU ID code (0x415) is an
; STM32L47x, so the L475 board target must be used: the L4S5 target puts the stack
; in RAM that does not exist and the firmware hard-faults before printing anything.
;
; Build and flash:   ~/.platformio/penv/bin/pio run -t upload
; Watch output:      ~/.platformio/penv/bin/pio device monitor
;
; Keep the flags below when the PlatformIO extension rewrites this file.

[env:disco_l475vg_iot01a]
platform = ststm32
board = disco_l475vg_iot01a
framework = arduino
upload_protocol = stlink
monitor_speed = 921600
build_flags =
	-DHAL_DFSDM_MODULE_ENABLED
	-DES_WIFI_MAX_DETECTED_AP=30
	-DSERIAL_RX_BUFFER_SIZE=512
	-Wl,-u,_printf_float
; HAL_DFSDM_MODULE_ENABLED: microphones (src/sound.cpp)
; ES_WIFI_MAX_DETECTED_AP: the Wi-Fi scan keeps 30 networks instead of the first 10 in no order
; SERIAL_RX_BUFFER_SIZE: serial commands of a few hundred bytes (the signing key) arrive while the loop is busy
; _printf_float: snprintf("%f") prints nothing without it
lib_deps =
	https://github.com/stm32duino/LSM6DSL.git
	https://github.com/stm32duino/HTS221.git
	https://github.com/stm32duino/LPS22HB.git
	https://github.com/stm32duino/VL53L0X.git
	https://github.com/stm32duino/LIS3MDL.git
	https://github.com/stm32duino/WiFi-ISM43362-M3G-L44.git
	adafruit/Adafruit PWM Servo Driver Library@^3.0.2
	stm32duino/STM32duinoBLE@^1.5.0
