# The creature's ear chip: Seeed XIAO ESP32S3 Sense, ESPHome, on-device wake
# word ("creature" model trained with microWakeWord's synthetic pipeline; until
# then the stock "okay nabu"/"hey jarvis" models prove the path).
# On wake it POSTs an event to the bridge's HTTP ingest. No audio leaves the chip.
#
#   bridge/.venv/bin/python -m pip install esphome      (or: uv pip install esphome)
#   cp ear/secrets.example.yaml ear/secrets.yaml      and fill in the Wi-Fi details
#   esphome run ear/creature-ear.yaml                 (first flash over USB, then over the air)

substitutions:
  name: creature-ear
  bridge: "192.168.1.92"          # the Mac running bridge.py (later: the hub)
  wake_model: okay_nabu           # replace with the custom "creature" model when trained

esphome:
  name: ${name}
  friendly_name: Creature ear
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - http_request.post:
        url: http://${bridge}:8776/hello
        request_headers:
          Content-Type: application/json
        body: '{"unit":"ear","fw":"esphome","sensors":["pdm-microphone","micro_wake_word:${wake_model}"]}'

ota:
  - platform: esphome

http_request:
  verify_ssl: false
  timeout: 3s

i2s_audio:
  - id: mic_bus
    i2s_lrclk_pin: GPIO42        # PDM clock on the Sense expansion board
    i2s_bclk_pin: GPIO41         # placeholder: PDM uses only clk + data; see note below

microphone:
  - platform: i2s_audio
    id: ear_mic
    i2s_audio_id: mic_bus
    i2s_din_pin: GPIO41
    adc_type: external
    pdm: true
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit

micro_wake_word:
  microphone: ear_mic
  models:
    - model: ${wake_model}
  on_wake_word_detected:
    - http_request.post:
        url: http://${bridge}:8776/event
        request_headers:
          Content-Type: application/json
        body: !lambda |-
          return "{\"unit\":\"ear\",\"name\":\"heard\",\"label\":\"creature\",\"model\":\"" + wake_word + "\"}";
    - delay: 2s

# Phones nearby: passive BLE scan, counting advertisers heard in the last 30 s.
# A presence hint, not identity. (This lived on the STM32 first; its BLE radio
# shares a bus with the Wi-Fi module and the scan stalled. Here it is native.)
esp32_ble_tracker:
  scan_parameters:
    active: false
    interval: 320ms
    window: 30ms
  on_ble_advertise:
    - then:
        - lambda: |-
            static std::map<std::string, uint32_t> seen;
            seen[x.address_str()] = millis();
            int n = 0;
            for (auto &kv : seen) if (millis() - kv.second < 30000) n++;
            id(ble_nearby) = n;

globals:
  - id: ble_nearby
    type: int
    initial_value: "0"

interval:
  - interval: 5s
    then:
      - http_request.post:
          url: http://${bridge}:8776/state
          request_headers:
            Content-Type: application/json
          body: !lambda |-
            return "{\"unit\":\"ear\",\"ble_nearby\":" + std::to_string(id(ble_nearby)) + "}";

# Notes
# - XIAO ESP32S3 Sense PDM microphone: clock GPIO42, data GPIO41. ESPHome's PDM
#   microphone uses the lrclk pin as the PDM clock; the bclk pin is unused for
#   PDM and is set to the data pin only to satisfy the schema. Check against the
#   ESPHome docs for the version you install.
# - Stage two (after the body): stream audio after the wake word to the hub for
#   speech to text, with ESPHome's voice_assistant component pointed at the hub.
